services:
  # =========================================================================
  # 1. MongoDB Database Service
  # =========================================================================
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - nearexpiry-network
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-nearexpiry}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # 2. Redis Caching Service
  # =========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - nearexpiry-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =========================================================================
  # 3. Backend Express Application Service (Node.js + Socket.IO)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - nearexpiry-network
    ports:
      - "${PORT_BACKEND:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/nearexpiry}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-nearexpiry_super_secret_jwt_signing_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-nearexpiry_refresh_token_secret_key_2026}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-nearexpiry_qr_hmac_signing_secret_2026}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-150}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =========================================================================
  # 4. Frontend Web Client Service (React + Vite + Nginx Reverse Proxy)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    restart: unless-stopped
    networks:
      - nearexpiry-network
    ports:
      - "${PORT_FRONTEND:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# =========================================================================
# Persistent Named Volumes
# =========================================================================
volumes:
  mongodb_data:
    name: nearexpiry_mongodb_data
  redis_data:
    name: nearexpiry_redis_data

# =========================================================================
# Isolated Application Network
# =========================================================================
networks:
  nearexpiry-network:
    name: nearexpiry-network
    driver: bridge
