# =========================================================================
# NearExpiry — Docker Compose Development Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# =========================================================================

services:
  # -------------------------------------------------------------------------
  # MongoDB Development (Expose port 27017 for MongoDB Compass / Host tooling)
  # -------------------------------------------------------------------------
  mongodb:
    ports:
      - "${PORT_MONGODB:-27017}:27017"

  # -------------------------------------------------------------------------
  # Redis Development (Expose port 6379 for RedisInsight / Local monitoring)
  # -------------------------------------------------------------------------
  redis:
    ports:
      - "${PORT_REDIS:-6379}:6379"

  # -------------------------------------------------------------------------
  # Backend Development (Hot-Reload with nodemon & host source mount)
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
    volumes:
      # Bind mount source code for live hot-reloading
      - ./backend/src:/app/src
      # Anonymous volume ensures container's Linux node_modules are preserved
      - /app/node_modules
    command: npm run dev
    ports:
      - "${PORT_BACKEND:-5000}:5000"

  # -------------------------------------------------------------------------
  # Frontend Development (Vite HMR dev server running on port 5173)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: npx vite --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_SOCKET_URL: http://localhost:5000
    volumes:
      # Bind mount frontend source files for live HMR updates
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      # Preserve container node_modules
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
